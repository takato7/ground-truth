name: ground-truth

services:
  backend:
    build: ./backend
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "${BACKEND_PORT:?BACKEND_PORT must be set in .env (see .env.example)}"
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL must be set in .env (see .env.example)}"
    ports:
      - "${BACKEND_PORT:?BACKEND_PORT must be set in .env (see .env.example)}:${BACKEND_PORT:?BACKEND_PORT must be set in .env (see .env.example)}"
    volumes:
      - db-data:/data

  # No depends_on: the frontend does not wait on backend health, so a later error state stays
  # observable in the UI.
  frontend:
    build: ./frontend
    command:
      - npm
      - run
      - dev
      - --
      - --host
      - 0.0.0.0
      - --port
      - "${FRONTEND_PORT:?FRONTEND_PORT must be set in .env (see .env.example)}"
      - --strictPort
    environment:
      API_PROXY_TARGET: "http://backend:${BACKEND_PORT:?BACKEND_PORT must be set in .env (see .env.example)}"
    ports:
      - "${FRONTEND_PORT:?FRONTEND_PORT must be set in .env (see .env.example)}:${FRONTEND_PORT:?FRONTEND_PORT must be set in .env (see .env.example)}"

volumes:
  db-data:
